name: Dev-Build

on: 
  workflow_call:
    inputs:
      mvnArgs:
        type: string
        required: false
      ivyVersion:
        type: string
        default: dev
        description: the ivy version to use (e.g. dev/nightly/nightly-10/...)
      javaVersion:
        type: number
        default: 25
      mvnVersion:
        type: string
        default: 3.10.0
      ivyPluginVersion:
        type: string
        default: 14.0.0
      ivyJavaHome:
        type: string
        default: $JAVA_HOME_25_X64
      targetBranchForBuildFromMaster:
        type: string
        required: false
        description: branch name to check out instead of the current ref when building from master
        default: ''
    secrets:
      mvnArgs:
        required: false

jobs:
  build:
    uses: axonivy-market/github-workflows/.github/workflows/ci.yml@v14
    with:
      mvnArgs: '"-Divy.engine.download.url=https://dev.axonivy.com/permalink/${{ inputs.ivyVersion }}/axonivy-engine.zip" "-Divy.engine.version=(12.0.0,]" "-Dproject.build.plugin.version=${{ inputs.ivyPluginVersion }}" ${{ inputs.mvnArgs }}'
      javaVersion: ${{ inputs.javaVersion }}
      mvnVersion: ${{ inputs.mvnVersion }}
      ivyVersion: ${{ inputs.ivyVersion }}
      ivyJavaHome: ${{ inputs.ivyJavaHome }}
      targetBranch: ${{ github.ref == 'refs/heads/master' && inputs.targetBranchForBuildFromMaster || '' }}
      migrateToLatestIvyVersion: true
    secrets:
      mvnArgs: '${{ secrets.mvnArgs }}'
