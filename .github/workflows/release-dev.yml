name: Release-Build-Dev
permissions:
  actions: read
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      javaVersion:
        type: number
        default: 21
      mvnVersion:
        type: string
        default: 3.9.13
      mvnArgs:
        type: string
        required: false
      dryRun:
        type: boolean
        default: true
      releaseWorkflowId:
        type: string
        default: release-dev.yml

env:
  # callers mark their dry runs with this suffix in "run-name", so that a dry run
  # is never mistaken for a released snapshot
  dryRunMarker: ' (dry run)'

jobs:
  check-changes:
    runs-on: ubuntu-latest
    if: ${{ !inputs.dryRun }}
    outputs:
      shouldRelease: ${{ steps.detect.outputs.shouldRelease }}
    steps:
      - name: Detect changes since the last release of this branch
        id: detect
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const dryRunMarker = process.env.dryRunMarker;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: '${{ inputs.releaseWorkflowId }}',
              branch,
              status: 'success',
              per_page: 100
            });

            const lastRelease = runs.data.workflow_runs.find(
              run => run.id !== context.runId && !run.display_title.includes(dryRunMarker)
            );

            if (!lastRelease) {
              core.info(`No previous release of ${branch} found. Release will run.`);
              core.setOutput('shouldRelease', 'true');
              return;
            }

            const shouldRelease = lastRelease.head_sha !== context.sha;
            core.info(`Last released SHA of ${branch}: ${lastRelease.head_sha}`);
            core.info(`Current SHA: ${context.sha}`);
            core.setOutput('shouldRelease', shouldRelease ? 'true' : 'false');

            if (!shouldRelease) {
              core.notice(`No changes on ${branch} since the last release. Skipping release jobs.`);
            }

  build:
    runs-on: ubuntu-latest
    needs: check-changes
    if: ${{ !cancelled() && (inputs.dryRun || needs.check-changes.outputs.shouldRelease == 'true') }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.javaVersion }}
          distribution: temurin
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ inputs.mvnVersion }}

      - name: Build with Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          goals="clean deploy"
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            goals="clean verify"
          fi

          mvn --batch-mode \
            -Dmaven.test.skip=true \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.event.repository.name }} \
            ${goals} ${{ inputs.mvnArgs }}
